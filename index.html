@media(prefers-color-scheme:dark){:root{--bg:#0a1222;--card:#111c33;--tx:#e6ecf7;--mu:#8fa0bf;--bd:#22304f;--nav:#0f2352;--pr:#2f7df0;--prh:#4a90f5;--ok:#4cc38a;--wa:#f0b74a;--er:#f27a6b;--and:#5aa4ff;--soft:#16233f;--pa:#a592f2;--avb:26%;--avf:82%}}
*{box-sizing:border-box}
body{margin:0;font:500 15px/1.45 "Manrope","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx)}
:focus-visible{outline:2.5px solid var(--pr);outline-offset:2px}
.st-pend,.s-pend{--c:var(--pend)}.st-and,.s-and{--c:var(--and)}.st-pausa,.s-pausa{--c:var(--pa)}.st-conf,.s-conf{--c:var(--wa)}.st-fim,.s-fim{--c:var(--ok)}
header{position:sticky;top:10px;z-index:5;width:min(936px,calc(100% - 24px));margin:12px auto 0;background:var(--nav);color:#fff;border-radius:22px;padding:10px 12px 10px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:0 14px 32px -16px rgba(8,30,34,.6)}
.logo{background:#fff;border-radius:14px;padding:5px 12px;height:52px;display:flex;align-items:center;flex:none;box-shadow:0 2px 8px -2px rgba(0,0,0,.25)}
.logo img{height:42px;width:auto;display:block}
header h1{font:700 18px/1.1 "Bricolage Grotesque","Manrope",system-ui,sans-serif;margin:0 0 0 2px;flex:1;min-width:150px}
header .sub{display:block;font:500 12.5px "Manrope",system-ui,sans-serif;opacity:.62;margin-top:3px}
.hb{background:rgba(255,255,255,.09);color:#fff;border:0;padding:9px 15px;border-radius:999px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.hb:hover{background:rgba(255,255,255,.18)}
.hb svg{width:15px;height:15px}
.hb.p{background:#1a7bff;color:#fff}.hb.p:hover{background:#3a8fff}
.badge{display:none;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(242,180,65,.18);color:#f2b441;align-items:center;gap:6px}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#f2b441}
body.leader .badge{display:inline-flex}
main{max-width:960px;margin:0 auto;padding:20px 12px 90px}
button{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 16px;transition:background .15s,border-color .15s}
button:hover{border-color:var(--mu)}
button.p{background:var(--pr);color:#fff;border-color:var(--pr)}button.p:hover{background:var(--prh)}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
@media(prefers-color-scheme:dark){button.ok{color:#04210f}}
button.er{color:var(--er)}
button.big{padding:14px 16px;font-size:16px}
.hb.lead{display:none}.lead{display:none}body.leader .lead{display:inline-block}body.leader .hb.lead{display:inline-flex}body.leader .lead.blk{display:flex}
.kpis{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:18px 20px 20px;margin-bottom:20px}
.kd{font-weight:700;font-size:13.5px;color:var(--mu)}.kd::first-letter{text-transform:uppercase}
.stack{display:flex;gap:3px;height:12px;margin:12px 0 18px;border-radius:99px;overflow:hidden;background:var(--soft)}
.stack i{background:var(--c);min-width:8px;border-radius:99px;transition:flex .4s}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.nums b{display:block;font:700 32px/1 "Bricolage Grotesque","Manrope",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.nums span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mu);font-weight:600;margin-top:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
@media(max-width:560px){.nums{grid-template-columns:repeat(3,1fr);row-gap:16px}}
.tabs{display:inline-flex;max-width:100%;overflow-x:auto;background:color-mix(in srgb,var(--mu) 14%,transparent);border-radius:999px;padding:4px;margin-bottom:2px}
.tabs button{border:0;background:transparent;border-radius:999px;color:var(--mu);padding:8px 18px;font-weight:700;font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 4px rgba(10,30,34,.16)}
.sec h2{font:700 16px "Bricolage Grotesque","Manrope",system-ui,sans-serif;margin:28px 0 12px;display:flex;align-items:center;gap:9px}
.cnt{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:0 9px;font:700 12px "Manrope",system-ui,sans-serif;color:var(--mu)}
.task{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;gap:14px;align-items:center;transition:border-color .15s,box-shadow .15s}
.task:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--bd));box-shadow:0 10px 24px -16px rgba(10,31,77,.45)}
.task.urg{border-color:color-mix(in srgb,var(--er) 45%,var(--bd))}
.s-fim{opacity:.8}
.ic{flex:none;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.ic svg{width:21px;height:21px}
.info{flex:1;min-width:0}
.t{font-weight:700;font-size:15.5px}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;font-size:12.5px;color:var(--mu);align-items:center}
.tag{background:var(--soft);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;color:var(--mu)}
.tag.urg{background:var(--er);color:#fff}
.tag.pz{background:color-mix(in srgb,var(--pa) 16%,transparent);color:var(--pa)}
.who{display:inline-flex;align-items:center;font-weight:700;color:var(--tx)}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 14px "Manrope",system-ui,sans-serif;background:hsl(var(--h) 55% var(--avb));color:hsl(var(--h) 55% var(--avf))}
.av.s{width:20px;height:20px;font-size:11px;margin-right:6px}
.clock{display:flex;align-items:center;gap:8px;font:800 19px "Manrope",system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--and);white-space:nowrap}
.clock.done{color:var(--mu);font-weight:700;font-size:15px}
.task.s-and .clock::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;animation:live 1.8s ease-out infinite}
@keyframes live{from{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 45%,transparent)}to{box-shadow:0 0 0 9px transparent}}
.clock.over,.bigclock.over,.bigclock.over span,.clock.done.over{color:var(--er)}
.pg{position:absolute;left:0;right:0;bottom:0;height:4px;background:color-mix(in srgb,var(--and) 12%,transparent)}
.pg i{display:block;height:100%;width:0;background:var(--and);border-radius:0 4px 4px 0;transition:width 1s linear}
.pg i.over{background:var(--er)}
.bigclock{font:800 46px/1.1 "Manrope",system-ui,sans-serif;font-variant-numeric:tabular-nums;text-align:center;color:var(--and);background:color-mix(in srgb,var(--and) 9%,var(--card));border-radius:22px;padding:18px 18px 18px;margin:16px 0}
.bigclock small{display:block;font:600 13px "Manrope",system-ui,sans-serif;color:var(--mu);margin-bottom:6px}
.bigclock .pg{position:static;margin-top:16px;border-radius:99px;overflow:hidden}
.empty{color:var(--mu);font-size:14px;padding:14px 16px;border:1.5px dashed var(--bd);border-radius:16px}
.err{color:var(--er);font-size:13px;margin-top:6px;min-height:16px}
.modal{position:fixed;inset:0;background:rgba(10,26,29,.55);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.on{display:flex}
.box{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:14px 22px 24px;animation:up .22s ease-out}
.box::before{content:"";display:block;width:40px;height:4px;border-radius:9px;background:var(--bd);margin:0 auto 14px}
@media(min-width:600px){.modal{align-items:center}.box{border-radius:28px;padding-top:24px}.box::before{display:none}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.box h3{font:700 22px/1.2 "Bricolage Grotesque","Manrope",system-ui,sans-serif;margin:0 0 8px}
label{display:block;font-size:13px;font-weight:700;color:var(--mu);margin:16px 0 6px}
input,select,textarea{width:100%;font:inherit;padding:11px 13px;border:1.5px solid var(--bd);border-radius:12px;background:var(--soft);color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:3px solid color-mix(in srgb,var(--pr) 25%,transparent);border-color:var(--pr)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:6px}
.nm{display:flex;align-items:center;gap:10px;text-align:left;border-radius:16px;padding:10px 12px}
.nm:hover{border-color:var(--pr);background:var(--soft)}
.nm.p,.nm.p:hover{background:var(--pr);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.row>*{flex:1}
.hist{font-size:12.5px;color:var(--mu);margin-top:18px;border-top:1px solid var(--bd);padding-top:12px;line-height:1.75}
.li{display:flex;gap:8px;align-items:center;margin:6px 0;padding:6px 10px 6px 14px;background:var(--soft);border-radius:12px}.li span{flex:1}.li button{padding:4px 12px;flex:0}
.fil{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:6px 16px 16px;margin-bottom:14px}
.fil label{margin:10px 0 4px}
.k5{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:15px 16px}
.kpi b{display:block;font:700 28px/1.1 "Bricolage Grotesque","Manrope",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--mu);font-weight:600}
.k5 .kpi small{display:block;color:var(--mu);font-size:12px;margin-top:3px}
.rgk{display:flex;align-items:center;gap:14px}
.rg{--ringc:var(--wa);flex:none;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--ringc) calc(var(--p)*1%),var(--bd) 0);-webkit-mask:radial-gradient(farthest-side,#0000 calc(100% - 8px),#000 calc(100% - 7px));mask:radial-gradient(farthest-side,#0000 calc(100% - 8px),#000 calc(100% - 7px))}
.rg.good{--ringc:var(--ok)}.rg.bad{--ringc:var(--er)}
.good{color:var(--ok)}.bad{color:var(--er)}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:18px;margin-bottom:14px}
.panel h4{margin:0 0 14px;font:700 16px "Bricolage Grotesque","Manrope",system-ui,sans-serif}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12.5px;font-weight:700;color:var(--mu);padding:6px 10px;border-bottom:1.5px solid var(--bd);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:hover td{background:var(--soft)}tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.pb{display:inline-block;width:70px;height:8px;background:var(--bd);border-radius:99px;vertical-align:middle;margin-right:6px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--ok);border-radius:99px}.pb i.w{background:var(--wa)}.pb i.r{background:var(--er)}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:6px;overflow-x:auto}
.chart .c{flex:1;min-width:28px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mu)}
.chart .c i{display:block;width:62%;background:var(--pr);border-radius:9px 9px 3px 3px;min-height:3px;margin-bottom:4px}
.chart .c b{color:var(--tx);font-size:11.5px;margin-bottom:3px}
.hbar{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
.hbar span.n{width:110px;flex:0 0 110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{flex:1;height:12px;background:var(--soft);border-radius:99px;position:relative}
.hbar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--pr)}
.hbar .tr u{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--wa);text-decoration:none}
.hbar span.v{width:150px;flex:0 0 150px;text-align:right;font-variant-numeric:tabular-nums;color:var(--mu);font-size:12px}
@media(max-width:560px){.hbar span.v{display:none}}
.leg{font-size:12px;color:var(--mu);margin-top:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.dbst{font-size:12px;font-weight:700;white-space:nowrap}.dbst.on{color:#2e9d57}.dbst.off{color:#d4962a}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const KEY='tarefas_app_v1';
const CATS=['Entrada','ML','Reposição','Separação','Conferência','Outros'];
const STATUS={conf:'Aguardando conferência',and:'Em andamento',pausa:'Pausadas',pend:'Pendentes',fim:'Finalizadas hoje'};
let S=fixS(load());let tab='Todos';let leader=false;
// setores: lista criada pelo administrador (guardada junto com as pessoas e o PIN)
function fixS(o){if(!Array.isArray(o.setores))o.setores=['Expedição','Escritório'];
  (o.tasks||[]).forEach(t=>{if(t.setor&&!o.setores.includes(t.setor))o.setores.push(t.setor)});return o}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.tasks)return d}catch(e){}
  return{tasks:[],pessoas:['Pessoa 1','Pessoa 2','Pessoa 3'],pin:'1234'}}
// ---------- banco de dados ----------
// NUVEM: preencha com os dados do Supabase (veja LEIA-ME-NUVEM.txt) para salvar na nuvem.
// Se deixar vazio, o sistema usa o servidor local (server.js).
const NUVEM={url:'https://yzrcfgpogzmcrjvqlopg.supabase.co',key:'sb_publishable_BLNH1MXp643EQK2p5a54oQ_75BNKj9O'};
// FIREBASE: preencha com os dados do Firebase (veja LEIA-ME-FIREBASE.txt). Tem prioridade sobre o Supabase.
// Modo otimizado: o Firebase avisa só o que mudou (sem consultas repetidas) e guarda uma cópia no aparelho.
const FIREBASE={projectId:'',apiKey:''};
const fbOn=()=>!!(FIREBASE.projectId&&FIREBASE.apiKey);
const nuvem=()=>fbOn()||!!(NUVEM.url&&NUVEM.key);
let FS=null,fbFirst=true;
const loadJs=src=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=no;document.head.appendChild(e)});
async function fbInit(){
  try{
    const B='https://www.gstatic.com/firebasejs/10.12.2/';
    await loadJs(B+'firebase-app-compat.js');await loadJs(B+'firebase-firestore-compat.js');
    firebase.initializeApp({apiKey:FIREBASE.apiKey,projectId:FIREBASE.projectId});
    FS=firebase.firestore();
    try{await FS.enablePersistence({synchronizeTabs:true})}catch(e){} // cache local: reabrir quase não gasta leituras
    // tarefas: recebe só os documentos novos/alterados/apagados
    FS.collection('tasks').onSnapshot({includeMetadataChanges:true},snap=>{
      setOnline(!snap.metadata.fromCache);
      if(fbFirst&&!snap.metadata.fromCache){fbFirst=false;
        if(snap.empty&&S.tasks.length){SNAP={};SNAPCFG='';push();return} // migra dados antigos do navegador
        const ids=new Set(snap.docs.map(d=>d.id)),n=S.tasks.length; // tira da tela o que já foi apagado no banco
        S.tasks=S.tasks.filter(t=>ids.has(t.id)||SNAP[t.id]!==JSON.stringify(t));Object.keys(SNAP).forEach(k=>{if(!ids.has(k)&&!S.tasks.some(t=>t.id===k))delete SNAP[k]});render()}
      let mudou=false;
      snap.docChanges().forEach(ch=>{
        const id=ch.doc.id;if(ch.doc.metadata.hasPendingWrites)return; // alteração feita aqui mesmo
        const loc=S.tasks.find(t=>t.id===id);
        if(loc&&SNAP[id]!==JSON.stringify(loc))return; // há edição local ainda não enviada
        if(ch.type==='removed'){if(loc){S.tasks=S.tasks.filter(t=>t.id!==id);delete SNAP[id];mudou=true}return}
        let v;try{v=JSON.parse(ch.doc.data().j)}catch(e){return}
        const str=JSON.stringify(v);if(loc&&SNAP[id]===str)return;
        if(loc)Object.keys(loc).forEach(k=>delete loc[k]),Object.assign(loc,v);else S.tasks.push(v);
        SNAP[id]=str;mudou=true});
      if(mudou){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}});
    // configurações (equipe, PIN, setores) em um único documento
    FS.collection('config').doc('main').onSnapshot(d=>{
      if(!d.exists||d.metadata.hasPendingWrites||cfgOf()!==SNAPCFG)return;
      try{const v=JSON.parse(d.data().j);S.pessoas=v.pessoas||S.pessoas;S.pin=v.pin||S.pin;S.setores=v.setores||S.setores;fixS(S);SNAPCFG=cfgOf();
        try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}catch(e){}});
  push()}catch(e){setOnline(false)}}
function fbSync(b){ // grava só o que mudou, em lote; o Firebase guarda na fila se estiver sem internet
  const col=FS.collection('tasks'),ops=[];
  (b.put||[]).forEach(t=>ops.push(x=>x.set(col.doc(t.id),{j:JSON.stringify(t),u:Date.now()})));
  (b.del||[]).forEach(id=>ops.push(x=>x.delete(col.doc(id))));
  if(b.pessoas||b.pin||b.setores)ops.push(x=>x.set(FS.collection('config').doc('main'),{j:JSON.stringify({pessoas:S.pessoas,pin:S.pin,setores:S.setores})}));
  for(let i=0;i<ops.length;i+=450){const bt=FS.batch();ops.slice(i,i+450).forEach(f=>f(bt));bt.commit().catch(()=>setOnline(false))}}
async function sb(path,opt={}){
  const h={apikey:NUVEM.key,'Content-Type':'application/json',...(opt.headers||{})};
  if(NUVEM.key.startsWith('eyJ'))h.Authorization='Bearer '+NUVEM.key;
  const r=await fetch(NUVEM.url.replace(/\/+$/,'')+'/rest/v1/'+path,{...opt,headers:h,cache:'no-store'});
  if(!r.ok)throw new Error('db '+r.status);return r}
async function apiState(){
  if(!nuvem()){const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw 0;return r.json()}
  const [rt,rc]=await Promise.all([sb('tasks?select=data&limit=10000'),sb('config?select=key,value')]);
  const tasks=(await rt.json()).map(x=>x.data),cfg={};(await rc.json()).forEach(x=>cfg[x.key]=x.value);
  return{tasks,pessoas:cfg.pessoas||['Pessoa 1','Pessoa 2','Pessoa 3'],pin:cfg.pin||'1234',setores:cfg.setores||null,vazio:!tasks.length&&!cfg.pessoas}}
async function apiSync(b){
  if(fbOn()){if(!FS)throw 0;fbSync(b);return}
  if(!nuvem()){const r=await fetch('/api/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw 0;return}
  const now=new Date().toISOString(),rows=(b.put||[]).map(t=>({id:t.id,data:t,updated_at:now}));
  if(b.pessoas||b.pin||b.setores)rows.push({id:'__config',data:{pessoas:S.pessoas,pin:S.pin,setores:S.setores},updated_at:now});
  const ka=x=>({keepalive:x.length<60000,body:x});
  if(rows.length){const x=JSON.stringify(rows);await sb('tasks',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},...ka(x)})}
  if(b.del&&b.del.length)await sb('tasks?id=in.('+b.del.map(encodeURIComponent).join(',')+')',{method:'DELETE',keepalive:true})}
// localStorage vira só cópia de segurança; a fonte da verdade é o servidor (server.js)
let SNAP={},SNAPCFG='',online=false,syncing=false,dirty=false;
const cfgOf=()=>JSON.stringify([S.pessoas,S.pin,S.setores]);
function snapshot(){SNAP={};S.tasks.forEach(t=>SNAP[t.id]=JSON.stringify(t));SNAPCFG=cfgOf()}
function setOnline(v){online=v;const b=$('#dbst');if(b){b.textContent=v?(nuvem()?'● Salvo na nuvem':'● Salvo no banco'):'● Sem conexão';b.className='dbst '+(v?'on':'off')}}
let pushT=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}idle=0;render();clearTimeout(pushT);pushT=setTimeout(push,600)}
function flush(){clearTimeout(pushT);push()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});addEventListener('pagehide',flush);
async function push(){
  if(syncing){dirty=true;return}
  const put=S.tasks.filter(t=>SNAP[t.id]!==JSON.stringify(t));
  const ids=new Set(S.tasks.map(t=>t.id));const del=Object.keys(SNAP).filter(id=>!ids.has(id));
  const cfgChanged=cfgOf()!==SNAPCFG;
  if(!put.length&&!del.length&&!cfgChanged)return;
  syncing=true;
  try{
    const body={put,del};if(cfgChanged){body.pessoas=S.pessoas;body.pin=S.pin;body.setores=S.setores}
    await apiSync(body);
    put.forEach(t=>SNAP[t.id]=JSON.stringify(t));del.forEach(id=>delete SNAP[id]);if(cfgChanged)SNAPCFG=cfgOf();setOnline(true)
  }catch(e){setOnline(false)}
  syncing=false;if(dirty){dirty=false;push()}
}
// ---- Supabase ultra leve ----
// 1 consulta minúscula (~100 bytes) a cada 10 s: "qual a última alteração e quantas tarefas existem?"
// Só se algo mudou, baixa APENAS as tarefas alteradas. Sem mudança = quase nenhum consumo.
// A configuração (equipe, PIN, setores) vai junto na tabela tasks, na linha especial "__config".
let VER={},LASTMAX='',idle=0;
try{VER=JSON.parse(localStorage.getItem(KEY+'_v'))||{};LASTMAX=localStorage.getItem(KEY+'_m')||''}catch(e){}
const saveV=()=>{try{localStorage.setItem(KEY+'_v',JSON.stringify(VER));localStorage.setItem(KEY+'_m',LASTMAX)}catch(e){}};
async function sbPage(q){const out=[];for(let o=0;;o+=500){const a=await(await sb(`tasks?${q}&limit=500&offset=${o}`)).json();out.push(...a);if(a.length<500)break}return out}
const unsentT=id=>{const t=S.tasks.find(x=>x.id===id);return !!t&&SNAP[id]!==JSON.stringify(t)};
async function sbPull(first){
  if(syncing)return;
  try{
    const r=await sb('tasks?select=updated_at&order=updated_at.desc&limit=1',{headers:{Prefer:'count=exact'}});
    const top=(await r.json())[0],total=parseInt((r.headers.get('content-range')||'').split('/')[1])||0,maxU=top?top.updated_at:'';
    setOnline(true);
    if(first&&total===0&&S.tasks.length){SNAP={};SNAPCFG='';VER={};LASTMAX='';push();return} // migra dados antigos do navegador
    const known=Object.keys(VER).length;
    if(!first&&maxU===LASTMAX&&total===known){idle++;return} // nada mudou
    idle=0;let mudou=false;
    const full=!LASTMAX||!known; // 1ª vez neste aparelho: baixa tudo; depois, só o que mudou
    const rows=await sbPage('select=id,data,updated_at&order=updated_at.asc,id.asc'+(full?'':'&updated_at=gte.'+encodeURIComponent(LASTMAX)));
    rows.forEach(rw=>{VER[rw.id]=rw.updated_at;
      if(rw.id==='__config'){if(cfgOf()!==SNAPCFG)return;const v=rw.data||{};
        const n=JSON.stringify([v.pessoas||S.pessoas,v.pin||S.pin,v.setores||S.setores]);
        if(n!==cfgOf()){S.pessoas=v.pessoas||S.pessoas;S.pin=v.pin||S.pin;if(v.setores)S.setores=v.setores;fixS(S);SNAPCFG=cfgOf();mudou=true}return}
      if(unsentT(rw.id))return;
      const str=JSON.stringify(rw.data),loc=S.tasks.find(t=>t.id===rw.id);
      if(loc&&SNAP[rw.id]===str)return;
      if(loc){Object.keys(loc).forEach(k=>delete loc[k]);Object.assign(loc,rw.data)}else S.tasks.push(rw.data);
      SNAP[rw.id]=str;mudou=true});
    if(maxU)LASTMAX=maxU;
    if(full||Object.keys(VER).length>total){ // alguém apagou tarefas: confere a lista de códigos
      const ids=new Set(full?rows.map(x=>x.id):(await sbPage('select=id&order=id.asc')).map(x=>x.id));
      Object.keys(VER).forEach(k=>{if(!ids.has(k))delete VER[k]});
      S.tasks=S.tasks.filter(t=>{if(ids.has(t.id)||unsentT(t.id))return true;delete SNAP[t.id];mudou=true;return false})}
    saveV();if(mudou||first){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}
  }catch(e){setOnline(false)}}
let pT=null;
function schedPoll(){clearTimeout(pT);pT=setTimeout(async()=>{if(!document.hidden){await pull(false);push()}schedPoll()},idle>12?30000:10000)}
async function pull(first){
  if(nuvem()&&!fbOn())return sbPull(first);
  if(syncing)return;
  try{
    const d=await apiState();setOnline(true);
    if(first&&d.vazio&&S.tasks.length){snapshot();SNAP={};SNAPCFG='';push();return} // migra dados antigos do navegador para o banco
    if(dirty||cfgOf()!==SNAPCFG||[...S.tasks].some(t=>SNAP[t.id]!==JSON.stringify(t)))return; // há alteração local ainda não enviada
    const novo=fixS({tasks:d.tasks,pessoas:d.pessoas,pin:d.pin,setores:d.setores});
    if(JSON.stringify(novo)===JSON.stringify(S)&&!first)return;
    S=novo;snapshot();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()
  }catch(e){setOnline(false)}
}
snapshot();if(fbOn())fbInit();else{pull(true);schedPoll();document.addEventListener('visibilitychange',()=>{if(!document.hidden){idle=0;pull(false)}})}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const now=()=>new Date().toISOString();
const fmt=i=>i?new Date(i).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ico=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICO={pend:ico('<circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/>'),and:ico('<path d="M8 6l10 6-10 6z"/>'),pausa:ico('<path d="M9 6v12M15 6v12"/>'),conf:ico('<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/>'),fim:ico('<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>')};
const av=(n,s='')=>`<span class="av ${s}" style="--h:${[...String(n)].reduce((a,c)=>a+c.charCodeAt(0)*37,0)%360}">${esc(String(n).trim().charAt(0).toUpperCase())}</span>`;
function log(t,txt){(t.hist=t.hist||[]).push({at:now(),txt})}
function dur(ms){ms=Math.max(0,Math.floor(ms/1000));const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60;const p=n=>String(n).padStart(2,'0');return p(h)+':'+p(m)+':'+p(s)}
// tempo total = acumulado de execuções anteriores + execução atual
const elapsed=t=>(t.acum||0)+(t.status==='and'&&t.iniAt?Date.now()-new Date(t.iniAt):0);
const allWho=t=>[t.quem,...(t.ajud||[])].filter(Boolean);
const whoTxt=t=>allWho(t).join(', ');
// tempo da tarefa (relógio) soma uma vez; o tempo de cada pessoa é creditado individualmente
function stopClock(t){if(t.iniAt){const ms=Date.now()-new Date(t.iniAt);t.acum=(t.acum||0)+ms;t.parts=t.parts||{};allWho(t).forEach(n=>{t.parts[n]=(t.parts[n]||0)+ms});t.iniAt=null}}
function partsOf(t){const p={...(t.parts||{})};const s=Object.values(p).reduce((a,b)=>a+b,0);if((t.acum||0)>s+1000&&t.quem)p[t.quem]=(p[t.quem]||0)+(t.acum-s);return p}
const evs=(t,tp)=>(t.ev||[]).filter(e=>e.tipo===tp).length;
const addEv=(t,o)=>(t.ev=t.ev||[]).push({at:now(),...o});
const MOT_P=['Falta de material / produto','Aguardando outro setor','Atender demanda urgente','Intervalo / refeição','Problema no sistema / equipamento','Outro'];
const MOT_T=['Sobrecarga / mudança de prioridade','Fim de turno','Ausência do responsável','Necessita de outro perfil / treinamento','Outro'];

function toggleLeader(){
  if(leader){leader=false}else{
    const p=prompt('Informe o PIN do líder:');if(p===null)return;
    if(p!==S.pin){alert('PIN incorreto.');return}leader=true}
  document.body.classList.toggle('leader',leader);if(!leader)view='tarefas';
  $('#btnLead').textContent=leader?'Sair do modo líder':'Acesso do líder';render()}

let view='tarefas';
function toggleView(){view=view==='painel'?'tarefas':'painel';render()}
function render(){
  $('#vTarefas').style.display=view==='tarefas'?'':'none';
  $('#vPainel').style.display=view==='painel'?'':'none';
  $('#btnView').textContent=view==='painel'?'Voltar às tarefas':'Painel de desempenho';
  if(view==='painel'&&leader){renderPainel();return}
  const hoje=new Date().toDateString();
  const all=S.tasks.filter(t=>tab==='Todos'||t.setor===tab);
  const c=s=>all.filter(t=>t.status===s&&(s!=='fim'||new Date(t.fimAt).toDateString()===hoje)).length;
  {const K=[['Pendentes',c('pend'),'pend'],['Em andamento',c('and'),'and'],['Pausadas',c('pausa'),'pausa'],['Em conferência',c('conf'),'conf'],['Finalizadas hoje',c('fim'),'fim']];
  $('#kpis').innerHTML=`<div class="kd">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</div><div class="stack">${K.map(k=>k[1]?`<i class="st-${k[2]}" style="flex:${k[1]}" title="${k[0]}: ${k[1]}"></i>`:'').join('')}</div><div class="nums">${K.map(k=>`<div><b>${k[1]}</b><span><i class="dot st-${k[2]}"></i>${k[0]}</span></div>`).join('')}</div>`}
  $('#tabs').innerHTML=['Todos',...S.setores].map(s=>`<button class="${s===tab?'on':''}" data-s="${esc(s)}" onclick="tab=this.dataset.s;render()">${esc(s)}</button>`).join('');
  $('#subT').textContent=S.setores.join(', ');
  const ord={alta:0,normal:1};
  let h='';
  for(const st of ['conf','and','pausa','pend','fim']){
    const l=all.filter(t=>t.status===st&&(st!=='fim'||new Date(t.fimAt).toDateString()===hoje)).sort((a,b)=>(ord[a.prio]??1)-(ord[b.prio]??1)||a.criada.localeCompare(b.criada));
    h+=`<div class="sec"><h2><i class="dot st-${st}"></i>${STATUS[st]} <span class="cnt">${l.length}</span></h2>`;
    h+=l.length?l.map(card).join(''):'<div class="empty">Nenhuma tarefa.</div>';
    h+='</div>'}
  $('#list').innerHTML=h;tick()}

function card(t){
  const ov=t.est&&elapsed(t)>t.est*60000?' over':'';
  const clk=t.status==='and'?`<div class="clock${ov}" data-id="${t.id}">${dur(elapsed(t))}</div>`:
            (t.status==='conf'||t.status==='fim')?`<div class="clock done${ov}" title="Tempo gasto">${dur(t.acum||0)}</div>`:t.status==='pausa'?`<div class="clock done" style="color:var(--pa)" data-pz="${t.id}" title="Tempo parada">${dur(Date.now()-new Date(t.pausaAt))}</div>`:'';
  return `<div class="task s-${t.status} ${t.prio==='alta'?'urg':''}" onclick="openTask('${t.id}')"><div class="ic">${ICO[t.status]}</div>
  <div class="info"><div class="t">${esc(t.titulo)}</div>
  <div class="meta"><span class="tag">${esc(t.setor)}</span><span class="tag">${esc(t.cat)}</span>
  ${t.criador?`<span class="tag" title="Adicionada por ${esc(t.criador)}">Rotina · ${esc(t.criador)}</span>`:''}
  ${t.prio==='alta'?'<span class="tag urg">Urgente</span>':''}
  ${t.status==='pend'&&t.marcados?.length?`<span class="tag" style="font-weight:700">Para: ${esc(t.marcados.join(', '))}</span>`:''}
  ${t.est?`<span>Previsto: ${t.est} min</span>`:''}
  ${t.quem?`<span class="who">${av(t.quem,'s')}${esc(whoTxt(t))}</span>`:''}
  ${t.status==='and'?`<span>Início: ${fmt(t.startAt||t.iniAt)}</span>`:''}
  ${t.status==='pausa'?`<span class="tag pz">${esc(t.motivo)}</span>`:''}
  ${t.status==='pausa'&&t.destino?`<span>Transferida para <b>${esc(t.destino)}</b></span>`:''}
  ${t.status==='conf'?`<span>Concluída: ${fmt(t.feitaAt)}</span>`:''}
  ${t.status==='fim'?`<span>Finalizada: ${fmt(t.fimAt)}</span>`:''}</div></div>${clk}${t.status==='and'&&t.est?`<div class="pg"><i data-pg="${t.id}"></i></div>`:''}</div>`}

// cronômetro ao vivo
function tick(){if(document.hidden)return;document.querySelectorAll('[data-pz]').forEach(el=>{const t=S.tasks.find(x=>x.id===el.dataset.pz);if(t&&t.pausaAt)el.textContent=dur(Date.now()-new Date(t.pausaAt))});
  document.querySelectorAll('[data-id]').forEach(el=>{const t=S.tasks.find(x=>x.id===el.dataset.id);if(t){el.textContent=dur(elapsed(t));const o=t.est&&elapsed(t)>t.est*60000;el.classList.toggle('over',!!o);const bc=el.closest('.bigclock');if(bc)bc.classList.toggle('over',!!o)}});document.querySelectorAll('[data-pg]').forEach(el=>{const t=S.tasks.find(x=>x.id===el.dataset.pg);if(t&&t.est){const p=elapsed(t)/(t.est*60000);el.style.width=Math.min(100,p*100)+'%';el.classList.toggle('over',p>1)}})}
setInterval(tick,1000);

function openTask(id){
  const t=get(id);if(!t)return;
  let h=`<h3>${esc(t.titulo)}</h3><div class="meta"><span class="tag">${esc(t.setor)}</span><span class="tag">${esc(t.cat)}</span>${t.prio==='alta'?'<span class="tag urg">Urgente</span>':''}</div>`;
  if(t.obs)h+=`<p>${esc(t.obs)}</p>`;
  if(t.status==='pend'){
    SEL=(t.marcados||[]).filter(n=>S.pessoas.includes(n));h+=`${t.marcados?.length?`<p>Marcada para: <b>${esc(t.marcados.join(', '))}</b></p>`:''}<label>Quem vai fazer — toque em um ou mais nomes (o 1º é o responsável)</label><div class="names" id="selNames">${S.pessoas.map(p=>`<button class="big nm" onclick="togSel(this)" data-n="${esc(p)}">${av(p)}<span>${esc(p)}</span></button>`).join('')}</div><div class="row"><button class="ok big" id="btnGo" onclick="assumir('${id}')" disabled>Iniciar tarefa</button></div>`}
  if(t.status==='and'){
    h+=`<p>Responsável: <b>${esc(t.quem)}</b></p>${equipeBox(t)}<div class="bigclock"><small>Tempo em execução${t.est?' — previsto '+t.est+' min':''}</small><span data-id="${id}">${dur(elapsed(t))}</span>${t.est?`<div class="pg"><i data-pg="${id}"></i></div>`:''}</div>
    <div class="row"><button class="ok big" onclick="terminei('${id}')">Concluir tarefa</button></div>
    <div class="row"><button onclick="formAjud('${id}')">Adicionar pessoa</button></div>
    <div class="row"><button onclick="formPausa('${id}')">Pausar tarefa</button><button onclick="formTransf('${id}')">Passar para outra pessoa</button></div>
    <div class="row lead blk"><button onclick="liberar('${id}')">Devolver à fila</button></div>`}
  if(t.status==='pausa'){
    const ord=[...S.pessoas].sort((a,b)=>(b===t.destino)-(a===t.destino));
    h+=`<p>${t.destino?'Transferida de <b>'+esc(t.pausaPor||'')+'</b> para <b>'+esc(t.destino)+'</b>':'Pausada por <b>'+esc(t.pausaPor||t.quem)+'</b>'}.<br>Motivo: <b>${esc(t.motivo)}</b>${t.just?'<br>Justificativa: '+esc(t.just):''}<br>${t.ajud?.length?'<br>Equipe: <b>'+esc(t.ajud.join(', '))+'</b>':''}<br>Tempo já trabalhado: <b>${dur(t.acum||0)}</b>${t.est?' (previsto '+t.est+' min)':''}</p>
    <div class="bigclock" style="color:var(--pa)"><small>Tempo parada</small><span data-pz="${id}">${dur(Date.now()-new Date(t.pausaAt))}</span></div>
    <label>Retomar: toque no nome de quem vai continuar</label><div class="names">${ord.map(p=>`<button class="${p===t.destino?'p ':''}big nm" onclick="retomar('${id}',this.dataset.n)" data-n="${esc(p)}">${av(p)}<span>${esc(p)}${p===t.destino?' (indicado)':''}</span></button>`).join('')}</div>
    <div class="row"><button onclick="formTransf('${id}')">Passar para outra pessoa</button></div>`}
  if(t.status==='conf'){
    h+=`<p>Responsável: <b>${esc(t.quem)}</b>${t.ajud?.length?'<br>Equipe: <b>'+esc(t.ajud.join(', '))+'</b>':''}<br>Tempo gasto: <b>${dur(t.acum||0)}</b>${t.est?' (previsto '+t.est+' min)':''}</p><p style="color:var(--mu)">Aguardando conferência do líder.</p>
    <div class="row lead blk"><button class="ok big" onclick="finalizar('${id}')">Conferido – Finalizar</button><button class="er" onclick="reprovar('${id}')">Devolver para refazer</button></div>`}
  if(t.status==='fim')h+=`<p>Responsável: <b>${esc(t.quem)}</b>${t.ajud?.length?'<br>Equipe: <b>'+esc(t.ajud.join(', '))+'</b>':''}<br>Tempo gasto: <b>${dur(t.acum||0)}</b>${t.est?' (previsto '+t.est+' min)':''}<br>Finalizada em ${fmt(t.fimAt)}</p>`;
  h+=`<div class="row lead blk"><button onclick="openNew('${id}')">Editar</button><button class="er" onclick="del('${id}')">Excluir</button></div>`;
  h+=`<div class="row"><button onclick="closeM()">Fechar</button></div>`;
  if(t.hist?.length)h+=`<div class="hist">${t.hist.map(x=>`${fmt(x.at)} — ${esc(x.txt)}`).join('<br>')}</div>`;
  $('#boxTask').innerHTML=h;$('#mTask').classList.add('on');if(t.status==='pend')refSel()}

function closeM(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('on'))}
const get=id=>S.tasks.find(x=>x.id===id);
let SEL=[];
function togSel(b){const n=b.dataset.n,i=SEL.indexOf(n);if(i<0)SEL.push(n);else SEL.splice(i,1);refSel()}
function refSel(){
  document.querySelectorAll('#selNames .nm').forEach(x=>{const k=SEL.indexOf(x.dataset.n);x.classList.toggle('p',k>=0);x.querySelector('span').textContent=x.dataset.n+(k===0&&SEL.length>1?' (responsável)':'')});
  $('#btnGo').disabled=!SEL.length}
function assumir(id){if(!SEL.length)return;const t=get(id);t.status='and';t.quem=SEL[0];t.ajud=SEL.slice(1);t.iniAt=now();t.startAt=t.startAt||t.iniAt;
  log(t,SEL.length>1?`${SEL[0]} iniciou a tarefa com ${SEL.slice(1).join(', ')}`:`${SEL[0]} iniciou a tarefa`);save();closeM()}
function equipeBox(t){const a=t.ajud||[];return a.length?`<p>Equipe: ${a.map((n,i)=>`<b>${esc(n)}</b> <button class=\"er\" style=\"padding:2px 8px;font-size:12px\" onclick=\"rmAjud('${t.id}',${i})\">remover</button>`).join(' · ')}</p>`:''}
function formAjud(id){const t=get(id);const disp=S.pessoas.filter(p=>!allWho(t).includes(p));
  closeM();$('#boxForm').innerHTML=`<h3>Adicionar pessoa à tarefa</h3><p style=\"color:var(--mu);margin:0\">A pessoa passa a contar tempo nesta tarefa a partir de agora. O cronômetro da tarefa não muda.</p>
  ${disp.length?`<label>Pessoa</label><select id=\"aP\">${disp.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`:'<p>Todas as pessoas cadastradas já estão nesta tarefa.</p>'}
  <div class=\"row\"><button onclick=\"closeM();openTask('${id}')\">Cancelar</button>${disp.length?`<button class=\"p\" onclick=\"addAjud('${id}')\">Adicionar</button>`:''}</div>`;
  $('#mForm').classList.add('on')}
function addAjud(id){const t=get(id),n=$('#aP').value;if(!n)return;stopClock(t);t.ajud=[...(t.ajud||[]),n];t.iniAt=now();log(t,`${n} entrou na tarefa`);save();closeM();openTask(id)}
function rmAjud(id,i){const t=get(id),n=(t.ajud||[])[i];if(!n)return;stopClock(t);t.ajud.splice(i,1);t.iniAt=now();log(t,`${n} saiu da tarefa`);save();openTask(id)}
function terminei(id){const t=get(id);stopClock(t);t.status='conf';t.feitaAt=now();log(t,`${t.quem} concluiu (tempo ${dur(t.acum)})`);save();closeM()}
function formPausa(id){
  closeM();$('#boxForm').innerHTML=`<h3>Pausar tarefa</h3><p style="color:var(--mu);margin:0">O cronômetro será interrompido. A justificativa é obrigatória e fica registrada para o líder.</p>
  <label>Motivo</label><select id="pM">${MOT_P.map(x=>`<option>${x}</option>`).join('')}</select>
  <label>Justificativa (obrigatória)</label><textarea id="pJ" rows="3" placeholder="Descreva o que aconteceu"></textarea><div class="err" id="pErr"></div>
  <div class="row"><button onclick="closeM();openTask('${id}')">Cancelar</button><button class="p" onclick="pausar('${id}')">Confirmar pausa</button></div>`;
  $('#mForm').classList.add('on');setTimeout(()=>$('#pJ').focus(),50)}
function pausar(id){const j=$('#pJ').value.trim();if(j.length<5){$('#pErr').textContent='Informe a justificativa (mínimo 5 caracteres).';return}

// ---------- PAINEL DE DESEMPENHO ----------
let F={per:'30',de:'',ate:'',setor:'',cat:'',pessoa:''};
const pct=(a,b)=>b?Math.round(a/b*100):null;
const hm=ms=>{const m=Math.round(ms/60000);return m>=60?Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'min':m+' min'};
function dados(){
  const lim=F.per==='tudo'||F.per==='custom'?null:(()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(+F.per-1));return d})();
  return S.tasks.filter(t=>(t.status==='conf'||t.status==='fim')&&t.feitaAt).filter(t=>{
    const d=new Date(t.feitaAt);
    if(lim&&d<lim)return false;
    if(F.per==='custom'){if(F.de&&d<new Date(F.de+'T00:00:00'))return false;if(F.ate&&d>new Date(F.ate+'T23:59:59'))return false}
    return(!F.setor||t.setor===F.setor)&&(!F.cat||t.cat===F.cat)&&(!F.pessoa||allWho(t).includes(F.pessoa)||partsOf(t)[F.pessoa]!=null)})}
const retr=t=>(t.hist||[]).filter(h=>h.txt.startsWith('Devolvida pelo líder')).length;
function agg(l){
  const r={n:l.length,tempo:0,comEst:0,noPrazo:0,real:0,prev:0,retr:0,pausas:0,transf:0,paus:0};
  l.forEach(t=>{const a=t.acum||0;r.tempo+=a;r.retr+=retr(t);r.pausas+=evs(t,'pausa');r.transf+=evs(t,'transf');r.paus+=t.pausado||0;if(t.est){r.comEst++;r.real+=a;r.prev+=t.est*60000;if(a<=t.est*60000)r.noPrazo++}});
  r.media=r.n?r.tempo/r.n:0;r.prazo=pct(r.noPrazo,r.comEst);r.efic=r.real?Math.round(r.prev/r.real*100):null;return r}
const cl=(v,g=90,w=70)=>v==null?'':v>=g?'good':v>=w?'':'bad';
const bar=(v,g=90,w=70)=>v==null?'-':`<span class="pb"><i class="${v>=g?'':v>=w?'w':'r'}" style="width:${Math.min(100,v)}%"></i></span>${v}%`;
function renderPainel(){
  const l=dados(),A=agg(l);
  const sel=(id,arr,v,all)=>`<select id="${id}" onchange="F.${id.slice(1)}=this.value;renderPainel()"><option value="">${all}</option>${arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`;

  let h=`<div class="fil">
   <div><label>Período</label><select onchange="F.per=this.value;renderPainel()">${[['1','Hoje'],['7','Últimos 7 dias'],['30','Últimos 30 dias'],['90','Últimos 90 dias'],['tudo','Todo o histórico'],['custom','Personalizado']].map(o=>`<option value="${o[0]}" ${F.per===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
   ${F.per==='custom'?`<div><label>De</label><input type="date" value="${F.de}" onchange="F.de=this.value;renderPainel()"></div><div><label>Até</label><input type="date" value="${F.ate}" onchange="F.ate=this.value;renderPainel()"></div>`:''}

  </div>`;

  const k=(v,t,s='',c='')=>`<div class="kpi"><b class="${c}">${v}</b><span>${t}</span>${s?`<small>${s}</small>`:''}</div>`;
  h+=`<div class="k5">
    ${k(A.n,'Tarefas concluídas',A.retr+' devolvida(s) p/ refazer')}
    ${k(hm(A.tempo),'Tempo total trabalhado')}
    ${k(hm(A.media),'Tempo médio por tarefa')}
    <div class="kpi rgk"><i class="rg ${cl(A.prazo)}" style="--p:${A.prazo||0}"></i><div><b class="${cl(A.prazo)}">${A.prazo==null?'-':A.prazo+'%'}</b><span>Dentro do tempo estipulado</span><small>${A.noPrazo} de ${A.comEst} com meta</small></div></div>
    ${k(A.pausas,'Pausas',hm(A.paus)+' parado(s)',A.pausas?'':'')}
    ${k(A.transf,'Transferências entre pessoas')}
    ${k(A.efic==null?'-':A.efic+'%','Eficiência (previsto / real)',A.efic==null?'':(A.efic>=100?'Mais rápido que o previsto':'Acima do tempo previsto'),cl(A.efic,100,80))}
  </div>`;

  // por funcionário
  const grp2=(f)=>{const m={};l.forEach(t=>{const k=f(t)||'-';(m[k]=m[k]||[]).push(t)});return Object.entries(m).map(([nome,x])=>({nome,...agg(x)})).sort((a,b)=>b.n-a.n)};
  const tab2=(rows,first)=>`<div class="tw"><table><tr><th>${first}</th><th>Tarefas</th><th>Tempo total</th><th>Tempo médio</th><th>No prazo</th><th>Eficiência</th><th>Refazer</th></tr>${rows.map(r=>`<tr><td><b>${esc(r.nome)}</b></td><td>${r.n}</td><td>${hm(r.tempo)}</td><td>${hm(r.media)}</td><td>${bar(r.prazo)}</td><td class="${cl(r.efic,100,80)}">${r.efic==null?'-':r.efic+'%'}</td><td>${r.retr}</td></tr>`).join('')}</table></div>`;
  const tabP=()=>{const m={};l.forEach(t=>{const p=partsOf(t);Object.keys(p).forEach(n=>{m[n]=m[n]||{tasks:[],ms:0,pa:0,tr:0};m[n].tasks.push(t);m[n].ms+=p[n]});(t.ev||[]).forEach(e=>{m[e.por]=m[e.por]||{tasks:[],ms:0,pa:0,tr:0};e.tipo==='pausa'?m[e.por].pa++:m[e.por].tr++})});
    const rows=Object.entries(m).filter(([n])=>!F.pessoa||n===F.pessoa).map(([nome,x])=>{const fin=x.tasks.filter(t=>allWho(t).includes(nome));const a=agg(fin);return{nome,part:x.tasks.length,fin:fin.length,ms:x.ms,media:x.tasks.length?x.ms/x.tasks.length:0,prazo:a.prazo,efic:a.efic,retr:a.retr,pa:x.pa,tr:x.tr}}).sort((a,b)=>b.fin-a.fin);
    return`<div class="tw"><table><tr><th>Funcionário</th><th>Participou</th><th>Concluiu</th><th>Tempo total</th><th>Tempo médio</th><th>No prazo</th><th>Eficiência</th><th>Refazer</th><th>Pausas</th><th>Passou p/ outro</th></tr>${rows.map(r=>`<tr><td><b>${esc(r.nome)}</b></td><td>${r.part}</td><td>${r.fin}</td><td>${hm(r.ms)}</td><td>${hm(r.media)}</td><td>${bar(r.prazo)}</td><td class="${cl(r.efic,100,80)}">${r.efic==null?'-':r.efic+'%'}</td><td>${r.retr}</td><td>${r.pa}</td><td>${r.tr}</td></tr>`).join('')}</table></div>`};
  h+=`<div class="panel"><h4>Desempenho por funcionário</h4>${tabP()}
    <div class="leg">No prazo: tarefas concluídas dentro do tempo estipulado. Eficiência: tempo previsto dividido pelo tempo real (acima de 100% = mais rápido que o previsto). Participou: tarefas em que trabalhou (inclui as passadas por transferência). Tempo total e médio: apenas o tempo que ele mesmo trabalhou. No prazo e eficiência: tarefas que ele concluiu. Refazer: vezes em que o líder devolveu a tarefa.</div></div>`;

  h+=`<div class="panel"><h4>Desempenho por setor</h4>${tab2(grp2(t=>t.setor),'Setor')}</div>`;
  const EV=l.flatMap(t=>(t.ev||[]).map(e=>({...e,tarefa:t.titulo}))).sort((a,b)=>b.at.localeCompare(a.at));
  if(EV.length){const mc={};EV.forEach(e=>{mc[e.motivo]=(mc[e.motivo]||0)+1});const mm=Object.entries(mc).sort((a,b)=>b[1]-a[1]),mxm=mm[0][1];
    h+=`<div class="panel"><h4>Pausas e transferências por motivo</h4>${mm.map(([n,v])=>`<div class="hbar"><span class="n" style="width:230px;flex-basis:230px" title="${esc(n)}">${esc(n)}</span><div class="tr"><i style="width:${v/mxm*100}%"></i></div><span class="v" style="width:40px;flex-basis:40px">${v}</span></div>`).join('')}
    <div class="tw" style="margin-top:12px"><table><tr><th>Data</th><th>Tarefa</th><th>Ocorrência</th><th>De</th><th>Para</th><th>Motivo</th><th>Justificativa</th></tr>${EV.slice(0,100).map(e=>`<tr><td>${fmt(e.at)}</td><td>${esc(e.tarefa)}</td><td>${e.tipo==='pausa'?'Pausa':'Transferência'}</td><td>${esc(e.por)}</td><td>${esc(e.para||'-')}</td><td>${esc(e.motivo)}</td><td style="white-space:normal;min-width:180px">${esc(e.just||'-')}</td></tr>`).join('')}</table></div></div>`}
  // detalhe

  h+=`<div class="panel"><h4>Detalhamento das tarefas (últimas ${det.length})</h4><div class="tw"><table><tr><th>Concluída em</th><th>Tarefa</th><th>Setor</th><th>Tipo</th><th>Executado por</th><th>Previsto</th><th>Real</th><th>Diferença</th></tr>${det.map(t=>{const a=t.acum||0,p=t.est*60000,df=t.est?a-p:null;return`<tr><td>${fmt(t.feitaAt)}</td><td>${esc(t.titulo)}</td><td>${esc(t.setor)}</td><td>${esc(t.cat)}</td><td>${esc(Object.entries(partsOf(t)).map(([n,ms])=>n+' ('+hm(ms)+')').join(', ')||whoTxt(t))}</td><td>${t.est?t.est+' min':'-'}</td><td>${dur(a)}</td><td class="${df==null?'':df<=0?'good':'bad'}">${df==null?'-':(df===0?'':df<0?'-':'+')+hm(Math.abs(df))}</td></tr>`}).join('')}</table></div>
   <div class="row"><button onclick="csv()" style="flex:0;white-space:nowrap">Exportar CSV</button></div></div>`;
  $('#vPainel').innerHTML=h}
function csv(){const l=dados().sort((a,b)=>a.feitaAt.localeCompare(b.feitaAt));
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['Concluida em','Tarefa','Setor','Tipo','Funcionario','Previsto (min)','Real (min)','Dentro do prazo','Refazer','Pausas','Transferencias','Tempo pausado (min)']];
  l.forEach(t=>rows.push([fmt(t.feitaAt),t.titulo,t.setor,t.cat,whoTxt(t),t.est||'',((t.acum||0)/60000).toFixed(1).replace('.',','),t.est?((t.acum||0)<=t.est*60000?'Sim':'Nao'):'',retr(t),evs(t,'pausa'),evs(t,'transf'),((t.pausado||0)/60000).toFixed(1).replace('.',',')]));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+rows.map(r=>r.map(q).join(';')).join('\n')],{type:'text/csv'}));a.download='desempenho.csv';a.click()}
render();
